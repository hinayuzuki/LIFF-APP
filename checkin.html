<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BOXチェックイン</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-size: 3rem; /* ★ フォント3倍 */
      line-height: 1.6;
      padding: 20px;
    }
    .result {
      margin-top: 40px;
    }
  </style>
</head>
<body>

<div id="result" class="result"></div>

<script>
  const LIFF_ID = "2010220926-voVn4JYp";
  const GAS_URL = "https://bitter-block-1a88.hinayuzuki.workers.dev/";

  function show(msg) {
    document.getElementById("result").innerHTML = msg;
  }

  liff.init({ liffId: LIFF_ID })
    .then(() => {

      const urlParams = new URLSearchParams(window.location.search);
      const box = urlParams.get("box");

      if (!box) {
        show("BOX番号が取得できませんでした。");
        return;
      }

      liff.getProfile().then(profile => {
        const lineId = profile.userId;

        fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lineId: lineId,
            box: box
          })
        })
        .then(res => res.text())
        .then(text => {

          if (text === "OK") {
            show(`
              <div>受付が完了しました</div>
              <div>BOX番号：${box}</div>
            `);
          } 
          else if (text === "CHECKED") {
            show(`
              <div>お客様はすでにチェックイン済みです。</div>
            `);
          }
          else if (text === "NO_MATCH") {
            show(`
              <div>受付できませんでした</div>
              <div>該当するデータがありません。</div>
            `);
          } 
          else {
            show(`
              <div>エラーが発生しました</div>
              <div>${text}</div>
            `);
          }
        })
        .catch(err => {
          show("送信エラー：" + err);
        });

      });
    })
    .catch(err => {
      show("LIFFの初期化に失敗しました。");
    });
</script>

</body>
</html>
