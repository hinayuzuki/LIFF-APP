<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BOXチェックイン</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<div id="log"></div>

<script>
  const LIFF_ID = "2010220926-voVn4JYp";
  const GAS_URL = "https://bitter-block-1a88.hinayuzuki.workers.dev/";

  function log(msg) {
    document.getElementById("log").innerHTML += `<p>${msg}</p>`;
  }

  log("DEBUG href: " + window.location.href);
  log("DEBUG search: " + window.location.search);

  liff.init({ liffId: LIFF_ID })
    .then(() => {

      const urlParams = new URLSearchParams(window.location.search);
      const box = urlParams.get("box");
      log("DEBUG box: " + box);

      if (!box) {
        log("BOX番号が取得できませんでした。");
        return;
      }

      liff.getProfile().then(profile => {
        const lineId = profile.userId;
        log("DEBUG lineId: " + lineId);

        fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lineId: lineId,
            box: box
          })
        })
        .then(res => res.text())
        .then(text => {
          log("GAS Response: " + text);
          log(`<h2>受付が完了しました</h2>`);
          log(`<p>BOX番号：${box}</p>`);
        })
        .catch(err => {
          log("送信エラー：" + err);
        });

      });
    })
    .catch(err => {
      log("LIFFの初期化に失敗しました。");
      log("DEBUG LIFF ERROR: " + err);
    });
</script>

</body>
</html>
