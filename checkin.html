<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BOXチェックイン</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<script>
  const LIFF_ID = "2010220926-voVn4JYp";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyqaz2XB7xJnNC1KdzPzWKqQ2zs8Bj_fjFPybm70oqxehFXYERliWWg3Fw4wPPIUEP9Vg/exec";

  // ★ デバッグ：実際に読み込まれた URL を表示
  document.body.innerHTML = `
    <p>DEBUG href: ${window.location.href}</p>
    <p>DEBUG search: ${window.location.search}</p>
  `;

  liff.init({ liffId: LIFF_ID })
    .then(() => {

      const urlParams = new URLSearchParams(window.location.search);
      const box = urlParams.get("box");

      // ★ デバッグ：取得した box を表示
      document.body.innerHTML += `<p>DEBUG box: ${box}</p>`;

      if (!box) {
        document.body.innerHTML += "<h2>BOX番号が取得できませんでした。</h2>";
        return;
      }

      liff.getProfile().then(profile => {
        const lineId = profile.userId;

        // ★ デバッグ：LINE ID を表示
        document.body.innerHTML += `<p>DEBUG lineId: ${lineId}</p>`;

        fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lineId: lineId,
            box: box
          })
        })
        .then(() => {
          document.body.innerHTML += `
            <h2>受付が完了しました</h2>
            <p>BOX番号：${box}</p>
          `;
        })
        .catch(err => {
          document.body.innerHTML += "<h2>送信エラー：" + err + "</h2>";
        });

      });
    })
    .catch(err => {
      document.body.innerHTML += "<h2>LIFFの初期化に失敗しました。</h2>";
      document.body.innerHTML += `<p>DEBUG LIFF ERROR: ${err}</p>`;
    });
</script>

</body>
</html>
