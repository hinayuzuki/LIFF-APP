<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<h2>doGet 呼び出しテスト</h2>
<div id="result">読み込み中...</div>

<script>
  async function main() {
    try {
      // ① LIFF 初期化
      await liff.init({ liffId: "2010026333-wO6tpBt7" });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      // ② LINEユーザーID取得
      const profile = await liff.getProfile();
      const userId = profile.userId;

      // ③ doGet 呼び出し
      const apiUrl =
        "https://script.google.com/macros/s/AKfycbxWxfIjmHtYgc8h2FSTWIE2vTIAUTdvjYvnyJfteZfRyx0So494y0NmDpdHsb9ppQg/exec?lineId="
        + userId;

      const res = await fetch(apiUrl);
      const text = await res.text();

      // ④ 結果を画面に表示
      document.getElementById("result").innerText = "doGet の返り値: " + text;

    } catch (e) {
      document.getElementById("result").innerText = "エラー: " + e;
    }
  }

  main();
</script>
</body>
</html>
