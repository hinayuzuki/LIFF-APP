<!DOCTYPE html>
<html>
<head>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<script>
  async function main() {
    // ① LIFF 初期化
    await liff.init({ liffId: "2010026333-wO6tpBt7" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    // ② LINEユーザーID取得
    const profile = await liff.getProfile();
    const userId = profile.userId;

    // ③ Apps Script（doGet）へ問い合わせ
    const apiUrl =
      "https://script.google.com/macros/s/AKfycbxWxfIjmHtYgc8h2FSTWIE2vTIAUTdvjYvnyJfteZfRyx0So494y0NmDpdHsb9ppQg/exec?lineId=" 
      + userId;

    const res = await fetch(apiUrl);
    const formUrl = await res.text();  // プリフィル or 新規URL

    // ④ Googleフォームへ遷移
    window.location.href = formUrl;
  }

  main();
</script>
</body>
</html>
