<!DOCTYPE html>
<html>
<head>
  <?!= HtmlService.createHtmlOutputFromFile('csp').getContent(); ?>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<script>
  async function main() {
    await liff.init({ liffId: "2010026333-wO6tpBt7" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    // LINEユーザID取得
    const profile = await liff.getProfile();
    const userId = profile.userId;

    // ★ Apps Script に問い合わせ（既存チェック）
    const apiUrl = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxWxfIjmHtYgc8h2FSTWIE2vTIAUTdvjYvnyJfteZfRyx0So494y0NmDpdHsb9ppQg/exec/exec?lineId=" + userId;

    const res = await fetch(apiUrl);
    const formUrl = await res.text();  // プリフィル or 新規URL が返る

    // ★ 返ってきたURLに遷移
    window.location.href = formUrl;
  }

  main();
</script>
</body>
</html>
