<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<script>
  async function main() {
    try {
      await liff.init({ liffId: "2010026333-wO6tpBt7" });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      const userId = profile.userId;

      const apiUrl =
        "https://script.google.com/macros/s/AKfycbyE9cKSMwEME156PsFSRQ1rVQ6VLNl8_MiNd01fIY1f0DRCZTUwKGh8kmI5OJ0hFeOM/exec?lineId="
        + userId;

      const res = await fetch(apiUrl);
      const formUrl = await res.text();

      // ★ URL はそのまま使う（encodeURI しない）
      window.location.href = formUrl;

    } catch (e) {
      alert("エラーが発生しました: " + e);
    }
  }

  main();
</script>

</body>
</html>
