<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>配達完了登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ★ LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    .box { margin-bottom: 20px; }
    button { padding: 12px 20px; font-size: 18px; }
    img { max-width: 100%; border: 1px solid #ccc; }
  </style>
</head>
<body>

<h2>📦 配達完了登録</h2>

<div class="box">
  <p>エリア：<span id="area"></span></p>
  <p>受付番号：<span id="number"></span></p>
  <p>配達員ID：<span id="userid"></span></p>
</div>

<!-- ★ 置き配場所写真を表示するエリア -->
<div class="box">
  <p>置き配場所写真：</p>

  <!-- ★ URL をまず表示（デバッグ用） -->
  <!-- <p id="placePhotoUrlText" style="word-break: break-all; color: blue;"></p> -->

  <!-- ★ 画像表示 -->
  <img id="placePhoto" src="" alt="置き配場所写真">
</div>

<div class="box">
  <input type="file" id="photo" accept="image/*" capture="camera">
</div>

<button id="sendBtn">配達完了として送信</button>

<p id="result"></p>

<script>
/* ================================
   ① URLパラメータ取得
================================ */
const params = new URLSearchParams(location.search);
const area = params.get("area");
const number = params.get("number");

document.getElementById("area").textContent = area;
document.getElementById("number").textContent = number;

/* ================================
   ② LIFF 初期化
================================ */
async function initLiff() {
  await liff.init({
    liffId: "2010390191-rg24OaGf"
  });

  const profile = await liff.getProfile();
  const userId = profile.userId;

  document.getElementById("userid").textContent = userId;

  return userId;
}

let deliveryUserId = null;

initLiff().then(async id => {
  deliveryUserId = id;

  /* ================================
     ★ 置き配場所写真を取得（GET）
  ================================= */
  const res = await fetch(
    `https://kanryo-houkoku.hinayuzuki.workers.dev/?area=${area}&number=${number}`
  );

  const json = await res.json();

  // ★ URL を画面に表示（デバッグ用）
  // document.getElementById("placePhotoUrlText").textContent =
  //   json.placePhotoUrl || "URLが取得できませんでした";

  // ★ Workers 経由で画像を表示（LINE対策）
  if (json.placePhotoUrl) {
    document.getElementById("placePhoto").src =
      `https://kanryo-houkoku.hinayuzuki.workers.dev/img?url=${encodeURIComponent(json.placePhotoUrl)}`;
  }
});


/* ================================
   ③ base64 変換
================================ */
function toBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}


/* ================================
   ④ Cloudflare Workers に送信（POST）
================================ */
document.getElementById("sendBtn").addEventListener("click", async () => {

  const file = document.getElementById("photo").files[0];
  if (!file) {
    alert("写真を選択してください");
    return;
  }

  const base64 = await toBase64(file);

  const payload = {
    area: area,
    number: number,
    userId: deliveryUserId,
    photoBase64: base64
  };

  document.getElementById("result").textContent = "送信中…";

  const res = await fetch("https://kanryo-houkoku.hinayuzuki.workers.dev/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const json = await res.json();
  document.getElementById("result").textContent = json.message || "写真登録完了しました";
});
</script>

</body>
</html>
